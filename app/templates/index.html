{% extends "base.html" %}

{% block content %}

<h2>Latest Blog Posts</h2>

{% if total_posts > 0 %}

    {% for post in posts %}

<div class="card mt-3">

<div class="card-body">

<h5>{{ post }}</h5>

</div>

</div>

    {% endfor %}

{% else %}

<p>No Blog Posts Available.</p>

{% endif %}

{% endblock %}
